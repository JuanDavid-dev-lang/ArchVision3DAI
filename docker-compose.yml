# Entorno local equivalente a produccion: PostgreSQL, Redis y almacenamiento
# compatible con S3. El servicio de IA se anade en la fase 6.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archvision
      POSTGRES_PASSWORD: archvision
      POSTGRES_DB: archvision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archvision
      MINIO_ROOT_PASSWORD: archvision-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  web:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://archvision:archvision@postgres:5432/archvision?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en el entorno}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: archvision
      S3_ACCESS_KEY_ID: archvision
      S3_SECRET_ACCESS_KEY: archvision-local
      REDIS_URL: redis://redis:6379
      AI_MODE: mock
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
